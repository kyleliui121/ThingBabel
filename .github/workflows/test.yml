name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04 # 钉住版本，避开 ubuntu-latest 静默迁移（2026-10-19 起切 26）
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24] # 20 = 最低支持线，24 = 开发主力版本
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: 安装依赖（hub + mock 设备）
        run: |
          npm install
          npm install --prefix ../devices/mock
      - name: 生成 config.json
        run: cp config.example.json config.json
      - name: 跑测试
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.log
      - name: 失败时输出测试日志尾部（公开可见，免登录排查）
        if: failure()
        shell: bash
        run: |
          {
            echo "### 测试失败尾部（node ${{ matrix.node-version }}）"
            echo '```'
            grep -E '✖|not ok|Error:|AssertionError|ℹ (tests|pass|fail)' test-output.log | tail -30
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          SUM=$(grep -E '✖|not ok|Error:|AssertionError|ℹ (tests|pass|fail)' test-output.log | tail -12 | cut -c1-260 | tr '\n' '|')
          echo "::error::${SUM:0:3900}"
      - name: 冒烟：中枢能启动并监听端口
        run: |
          node scripts/dev.js &
          sleep 5
          curl -sf http://127.0.0.1:3000/api/login -X POST -H 'Content-Type: application/json' -d '{"password":"lab123"}' > /dev/null
          echo "smoke ok"
